{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div style="max-width:420px;margin:5rem auto;">

  <div style="text-align:center;margin-bottom:2rem;" class="fade-up">
    <div style="font-size:36px;font-weight:900;letter-spacing:-1px;margin-bottom:4px;">
      Stock<span style="color:var(--green);">Sim</span><span style="color:var(--blue);">.</span>
    </div>
    <div style="color:var(--muted);font-size:13px;">Real-time stock trading simulator</div>
  </div>

  <div class="card fade-up delay-1" style="border-color:var(--border2);">
    <h3 style="margin-bottom:1.5rem;font-size:16px;">Sign in to your account</h3>
    <form method="POST">
      <div style="margin-bottom:1rem;">
        <label>Email address</label>
        <input type="email" name="email" required placeholder="you@email.com" autofocus>
      </div>
      <div style="margin-bottom:1.5rem;">
        <label>Password</label>
        <input type="password" name="password" required placeholder="••••••••">
      </div>
      <button class="btn btn-primary" style="width:100%;height:40px;font-size:14px;" type="submit">
        Sign In
      </button>
    </form>
    <p style="text-align:center;margin-top:1.25rem;font-size:13px;color:var(--muted);">
      No account? <a href="/register" style="color:var(--blue);font-weight:500;">Create one free</a>
    </p>
  </div>

  <div style="text-align:center;margin-top:1.5rem;color:var(--muted);font-size:12px;" class="fade-up delay-2">
    Get $100,000 virtual cash &nbsp;·&nbsp; Trade any stock &nbsp;·&nbsp; Live market prices
  </div>
</div>
{% endblock %}
